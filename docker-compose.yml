services:
  alib-fetcher:
    image: ${ALIB_FETCHER_IMAGE:-ghcr.io/kemko/alib-fetcher:latest}
    command: ["-service", "-config", "/etc/alib-fetcher/config.toml"]
    restart: unless-stopped
    read_only: true
    volumes:
      - ./config:/etc/alib-fetcher:ro
      - alib-fetcher-state:/var/lib/alib-fetcher
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  alib-fetcher-state:

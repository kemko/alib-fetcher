---

services:
  alib-fetcher:
    image: ${ALIB_FETCHER_IMAGE:-ghcr.io/kemko/alib-fetcher:latest}
    restart: unless-stopped
    read_only: true
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?TELEGRAM_CHAT_ID is required}
      CRON_SCHEDULE: "${CRON_SCHEDULE:-0 0 * * *}"
      TIMEZONE: ${TIMEZONE:-Europe/Moscow}
      RUN_ON_STARTUP: "${RUN_ON_STARTUP:-true}"
      FRESH_BOOKS: "${FRESH_BOOKS:-}"
      STATE_PATH: /var/lib/alib-fetcher/state.db
      ALIB_URL: ${ALIB_URL:-https://www.alib.ru/tramka.phtml?tnew=7}
      ALIB_REQUEST_INTERVAL: ${ALIB_REQUEST_INTERVAL:-1s}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-30s}
      MESSAGE_LIMIT: ${MESSAGE_LIMIT:-32000}
      SLINK_URL: ${SLINK_URL:-}
      SLINK_API_KEY: ${SLINK_API_KEY:-}
      SLINK_TAG_ID: ${SLINK_TAG_ID:-}
    volumes:
      - alib-fetcher-state:/var/lib/alib-fetcher
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  alib-fetcher-state:

name: Verify and publish

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version
          install-only: true
      - name: Verify formatting, lint, tests and build
        run: make fmt-check lint test build GOLANGCI_LINT="$(command -v golangci-lint)"
      - name: Scan Go vulnerabilities
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: ''
          go-version-file: go.mod
          repo-checkout: false
          go-package: ./...

  container:
    name: Verify container inputs
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Verify local files are ignored
        run: |
          git check-ignore --no-index --quiet .env
          git check-ignore --no-index --quiet .env.local
          git check-ignore --no-index --quiet data/state.db
          git check-ignore --no-index --quiet config.toml
          git check-ignore --no-index --quiet config/config.toml
          if git check-ignore --no-index --quiet .env.example; then
            exit 1
          fi
          if git check-ignore --no-index --quiet config.example.toml; then
            exit 1
          fi
          mkdir -p data nested config .ralphex
          touch .env .env.local data/state.db state.db nested/state.db config.toml config/config.toml .ralphex/secret
          docker buildx build \
            --file .github/docker-context.Dockerfile \
            --output type=local,dest="${RUNNER_TEMP}/docker-context" \
            .
          test -f "${RUNNER_TEMP}/docker-context/context/go.mod"
          test -f "${RUNNER_TEMP}/docker-context/context/vendor/modules.txt"
          test ! -e "${RUNNER_TEMP}/docker-context/context/.env"
          test ! -e "${RUNNER_TEMP}/docker-context/context/.env.local"
          test ! -e "${RUNNER_TEMP}/docker-context/context/data/state.db"
          test ! -e "${RUNNER_TEMP}/docker-context/context/state.db"
          test ! -e "${RUNNER_TEMP}/docker-context/context/nested/state.db"
          test ! -e "${RUNNER_TEMP}/docker-context/context/config.toml"
          test ! -e "${RUNNER_TEMP}/docker-context/context/config/config.toml"
          test ! -e "${RUNNER_TEMP}/docker-context/context/.ralphex/secret"
      - name: Validate Compose configuration
        run: docker compose config --quiet

  image:
    name: Build image
    needs: container
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish image
    needs: container
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
